<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="welcomeTitle"></title>
  <link rel="stylesheet" href="style.css">
  <style>
    .art { max-width: 360px; }
  </style>
</head>
<body>
  <main class="page">
    <!-- Browser → shield → internet: everything goes through the VPN -->
    <svg class="art" viewBox="0 0 360 140" role="img" data-i18n-label="welcomeArt">
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="28" width="96" height="78" rx="11" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
        <path d="M6 48h96" stroke="var(--ink)" stroke-width="3"/>
        <path d="M22 66h48M22 80h60M22 92h32" stroke="var(--line)" stroke-width="6"/>
        <path d="M102 67h46M212 67h46" stroke="var(--safe)" stroke-width="4" stroke-dasharray="2 9"/>
        <path d="M180 18l-32 12v24c0 22 14 38 32 44 18-6 32-22 32-44V30z" fill="var(--safe)" stroke="none"/>
        <path d="M165 58l10 10 21-21" stroke="#fff" stroke-width="6"/>
        <circle cx="300" cy="67" r="40" fill="var(--surface)" stroke="var(--ink)" stroke-width="3"/>
        <ellipse cx="300" cy="67" rx="16" ry="40" stroke="var(--ink)" stroke-width="2.5"/>
        <path d="M260 67h80M266 47h68M266 87h68" stroke="var(--ink)" stroke-width="2.5"/>
      </g>
    </svg>

    <h1 data-i18n="welcomeHeading"></h1>
    <p class="lead" data-i18n="welcomeLead"></p>

    <ol class="steps">
      <li><strong data-i18n="welcomeStep1Title"></strong><span data-i18n="welcomeStep1Body"></span></li>
      <li><strong data-i18n="welcomeStep2Title"></strong><span data-i18n="welcomeStep2Body"></span></li>
    </ol>

    <p class="note" data-i18n="welcomeNote"></p>
  </main>
  <script src="i18n.js"></script>
</body>
</html>
